name = "momo-nan2026-ai"
main = "src/index.ts"
compatibility_date = "2026-08-10"

[vars]
GEMINI_MODEL = "gemma-4-26b-a4b-it"
ALLOWED_ORIGIN = "https://jinjinjin459.github.io"

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "targeted"
region = "gcp:us-east4"

# Deploy steps:
# 1. npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
# 2. npx wrangler deploy --config worker/wrangler.toml
# 3. Build the web app with VITE_API_BASE_URL set to the Worker URL.
